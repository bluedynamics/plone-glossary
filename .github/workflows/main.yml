name: "Main CI"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  code-analysis:
    name: "Code analysis checks"
    uses: plone/meta/.github/workflows/frontend-code.yml@2.x
    needs:
        - config
    with:
        node-version: ${{ needs.config.outputs.node-version }}

  unit:
    name: "Run unit tests (Node ${{ matrix.node-version }})"
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.x", "26.x"]
    uses: plone/meta/.github/workflows/frontend-unit.yml@2.x
    needs:
        - config
    with:
        node-version: ${{ matrix.node-version }}

  unit-floor:
    name: "Run unit tests (Volto 19.5.1)"
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
      - name: Main checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.x"

      - name: Enable corepack
        shell: bash
        run: |
          npm i -g corepack@latest
          corepack enable
          corepack prepare --activate

      - name: Pin Volto to the lowest supported version
        run: node scripts/set-volto-version.mjs 19.5.1

      # The committed lockfile belongs to the development Volto version,
      # so this job must not install with a frozen lockfile.
      - name: Install project dependencies
        env:
          npm_config_frozen_lockfile: "false"
        run: make install

      - name: Unit tests
        run: make ci-test

  i18n:
    name: "Run i18n checks"
    uses: plone/meta/.github/workflows/frontend-i18n.yml@2.x
    needs:
        - config
    with:
        node-version: ${{ needs.config.outputs.node-version }}

  acceptance:
    name: "Run acceptance tests"
    uses: plone/meta/.github/workflows/frontend-acceptance.yml@2.x
    needs:
        - config
    with:
        node-version: ${{ needs.config.outputs.node-version }}

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - code-analysis
      - unit
      - unit-floor
      - acceptance
      - i18n
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| code-analysis | ${{ needs.code-analysis.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| unit | ${{ needs.unit.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| unit-floor | ${{ needs.unit-floor.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| acceptance | ${{ needs.acceptance.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| i18n | ${{ needs.i18n.result }} |' >> $GITHUB_STEP_SUMMARY
