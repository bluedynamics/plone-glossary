[project]
name = "plone-glossary-documentation"
description = "Documentation of @bluedynamics/plone-glossary, glossary tooltips and glossary views for Plone, built for Volto."
keywords = [
    "plone-glossary",
    "documentation",
    "Plone",
    "Volto",
]
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
maintainers = [
    { name = "Jens W. Klein", email = "jk@kleinundpartner.at" },
]
authors = [
    { name = "Jens W. Klein", email = "jk@kleinundpartner.at" },
]
classifiers = [
    # This project only builds the documentation site. PyPI rejects uploads with this classifier.
    "Private :: Do Not Upload",
    "Framework :: Plone",
    "Topic :: Documentation",
]

[dependency-groups]
dev = [
    "myst-parser",
    "plone-sphinx-theme>=1.4.1",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-notfound-page",
    "sphinx-sitemap",
    "sphinxext-opengraph",
    "vale",
]

[project.urls]
Repository = "https://github.com/bluedynamics/plone-glossary"
Documentation = "https://bluedynamics.github.io/plone-glossary/"

[tool.uv]
# The documentation is not a Python package. uv installs only its dependencies.
package = false
